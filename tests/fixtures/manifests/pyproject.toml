[build-system]
requires = ["hatchling"]

[project]
name = "demo"
dependencies = [
  "httpx>=0.27",
  "pydantic[email]>=2",  # comment with "quotes"
  'attrs',
]

[project.optional-dependencies]
docs = ["sphinx", "furo"]

[dependency-groups]
test = ["pytest>=8", {include-group = "lint"}]
lint = ["ruff"]

[tool.poetry.dependencies]
python = "^3.12"
rich = "^13"
local-thing = { path = "../local-thing", develop = true }

[tool.poetry.group.dev.dependencies]
black = { version = "^24", optional = true }

[tool.pixi.pypi-dependencies]
demo = { path = ".", editable = true }

[tool.pixi.dependencies]
python = "3.12.*"
pandas = ">=2"
openssl = "*"

[tool.uv]
dev-dependencies = ["mypy"]
