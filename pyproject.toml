[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oss-cost"
version = "0.1.0"
description = "Total Cost of Stewardship: annual unit cost of an open source Python package"
requires-python = ">=3.12"
# Runtime dependencies are managed by pixi (see pixi.toml).
dependencies = []

[project.scripts]
oss-cost = "oss_cost.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oss_cost"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [".pixi"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
