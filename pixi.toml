[workspace]
name = "oss-cost-research"
version = "0.1.0"
description = "Total Cost of Stewardship: annual unit cost of an open source Python package"
channels = ["conda-forge"]
platforms = ["linux-64", "linux-aarch64", "win-64", "osx-64", "osx-arm64"]

[tasks]
# pixi run cost urllib3 --annual-funding 15525
cost = "python -m oss_cost"

[dependencies]
python = ">=3.12,<3.13"
httpx = ">=0.27,<1.0"
pydantic = ">=2.7,<3.0"
pydantic-settings = ">=2.3,<3.0"

[pypi-dependencies]
oss-cost = { path = ".", editable = true }

[feature.dev.dependencies]
pytest = ">=8.0"
ruff = ">=0.6"

[feature.dev.tasks]
test = "pytest"
lint = "ruff check ."
format = "ruff format ."

[environments]
default = ["dev"]
prod = []
